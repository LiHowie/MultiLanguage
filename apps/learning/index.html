<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔多 · 语言学习</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><span class="mark">M</span><div><h1>魔多</h1><p>把每次表达，变成一次学习。</p></div><span class="badge">基础输入免费 · 会员 20 元/月</span></header>
<section><h2>账号与学习记录</h2><div class="row"><input id="email" type="email" autocomplete="username" placeholder="邮箱"><input id="password" type="password" autocomplete="current-password" minlength="10" placeholder="密码，至少 10 位"></div><div class="row"><button id="login">登录</button><button id="register" class="secondary">注册</button><button id="logout" class="secondary">退出</button><button id="refresh" class="secondary">刷新会员与学习记录</button></div><p id="account">登录后可以同步主动收藏的学习卡片。</p><p id="usage"></p><p class="muted">当前为开发版，尚未开放付款。测试会员由运营人员开通；会员到期后，基础输入和本地词汇翻译仍可使用。</p></section>
<section><h2>整句翻译</h2><div class="row"><label>输入语言 <select id="source"><option value="zh">中文</option><option value="en">英语</option><option value="ja">日语</option></select></label><label>学习语言 <select id="target"><option value="en">英语</option><option value="ja">日语</option><option value="zh">中文</option></select></label><label><select id="style"><option value="conversational">口语化</option><option value="formal">书面化</option></select></label></div><textarea id="input" rows="3" placeholder="输入你想表达的完整句子"></textarea><label class="consent"><input id="consent" type="checkbox">我同意将本次文字或主动录音发送到魔多服务及配置的 AI 服务商处理。</label><button id="translate">翻译整句</button><div id="translation" class="result"></div><div class="row"><button id="saveTranslation" class="secondary">收藏到学习卡片</button><button id="copyTranslation" class="secondary">复制译文</button></div></section>
<section><h2>语音老师</h2><p>说一句，查看含义和表达建议，再跟读一次。</p><div class="row"><select id="mode"><option value="native">母语输入 · 保留识别原文</option><option value="learning">外语学习 · 释义与表达纠错</option></select><button id="record">按住说话</button><button id="repeat" class="secondary">显示正确句子并跟读</button></div><p id="recordStatus">每次最长 30 秒。识别和纠错均属于会员服务。</p><div id="voice" class="result"></div><div class="row"><button id="copyVoice" class="secondary">复制输出</button><button id="saveVoice" class="secondary">收藏纠正句子</button></div><p class="muted">AI 提供表达建议，不能替代老师的判断；这里不进行发音评分。</p></section>
<section><h2>学习卡片</h2><div id="cards"></div></section><p id="status" role="status" aria-live="polite"></p><footer>魔多客户端按 GPL-3.0-or-later 发布，基于青简。<a href="https://github.com/LiHowie/MultiLanguage">源码与许可</a></footer></main><script src="/learning.js"></script></body></html>
